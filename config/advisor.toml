# Non-secret settings. Secrets (API keys, passwords) stay in environment variables / .env.

[runtime]
# Tokio worker threads. Usually the number of CPU cores is a good start.
worker_threads = 10

[logging]
# Log filter: a level (error, warn, info, debug, trace), optionally per crate.
# The RUST_LOG environment variable overrides it, e.g. RUST_LOG=debug cargo run.
filter = "info"

[llm]
# Which provider the agent uses. Switching is a config change: edit this line and restart.
provider = "anthropic"
# Upper bound for one whole LLM call (TimedProvider). Keep it above the
# provider's own HTTP timeout below, so retries added later still fit.
call_timeout_secs = 180

[llm.anthropic]
url = "https://api.anthropic.com/v1/messages"
version = "2023-06-01"
model = "claude-sonnet-5-5"
timeout_secs = 120

# [llm.openai]   <- added once an OpenAiProvider exists

[agent]
max_tokens = 4096
max_tool_rounds = 5
system_prompt = """
You are a portfolio research assistant. You explain market data and news clearly \
and cite your sources. You never tell the user to buy or sell a specific security.
"""

[tools]
# Tools the agent may call. Remove a name to switch a tool off.
enabled = ["current_date", "price_history", "search_news"]

[startup]
# How long each service (e.g. Postgres) may take to answer its health check.
health_check_timeout_secs = 10

[postgres]
# Trading app's database. The password comes from POSTGRES_PASSWORD in .env.
host = "localhost"
port = 5433
database = "TMYTS_DB"
# A read-only user is recommended: see sql/advisor_readonly_user.sql
username = "tmyts_agent"
max_connections = 5
# How long to wait for a free connection from the pool.
acquire_timeout_secs = 10

[embeddings]
# The embedding service that embedded the news in Qdrant (the one tmyts-fin-advisor used).
# It must be the same model, or searches compare vectors that do not belong together.
url = "http://localhost:8500/embed"
timeout_secs = 15
# Must equal the Qdrant collection's vector size; checked at startup.
vector_size = 384

[qdrant]
# gRPC port (6334), not the REST/dashboard port (6333).
url = "http://localhost:6334"
collection = "rss_news_v1"
timeout_secs = 10

[news_search]
# Results when the model does not ask for a number, and the most it may ask for.
default_results = 5
max_results = 10
# Article text is cut to this many characters per result (each one costs tokens).
max_excerpt_chars = 1500

[warden]
# Prompt-injection filter for news text, scored 0.0 (clean) to 1.0 (certain attack).
# Each rule category adds evidence; two weak signals together score higher than one.
# From sanitize_at on, suspicious parts are replaced by [removed] and the result is flagged;
# from block_at on, the article is withheld from the model. Detections are logged as warnings.
sanitize_at = 0.3
block_at = 0.7

# Token prices for cost tracking, in USD per million tokens (MTok).
# Prices change: check https://platform.claude.com/docs/en/about-claude/pricing
# (these were taken from it in November 2026). A model without an entry still
# works, but its cost is reported as "unknown", and evals with max_cost_usd fail.
# The model id must match [llm.anthropic] model (a longer dated id also matches).
[pricing.models."claude-sonnet-5-5"]
input_per_mtok = 2.0
output_per_mtok = 10.0
# 5-minute cache writes; cache hits are a fraction of normal input.
cache_write_per_mtok = 2.5
cache_read_per_mtok = 0.10

[pricing.models."claude-haiku-5-5"]
input_per_mtok = 0.10
output_per_mtok = 0.50
cache_write_per_mtok = 0.125
cache_read_per_mtok = 0.01
# Haiku 5.5 bills a whole request at higher prices when its input (cache
# reads and writes included) is over 100,000 tokens.
[pricing.models."claude-haiku-5-5".long_context]
above_input_tokens = 100_000
input_per_mtok = 0.50
output_per_mtok = 2.50
cache_write_per_mtok = 0.625
cache_read_per_mtok = 0.05

[evals]
# Run with: cargo run -p advisor-evals   (calls the paid API, real Postgres and Qdrant)
cases_file = "evals/cases.toml"
# One <timestamp>.json and one <timestamp>.md per run.
report_dir = "evals/reports"
# Upper bound for one whole case (all its LLM and tool calls).
case_timeout_secs = 300
