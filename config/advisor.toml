# Non-secret settings. Secrets (API keys, passwords) stay in environment variables / .env.

[llm]
# Which provider the agent uses. Switching is a config change: edit this line and restart.
provider = "anthropic"

[llm.anthropic]
url = "https://api.anthropic.com/v1/messages"
version = "2023-06-01"
model = "claude-sonnet-5-5"
timeout_secs = 120

# [llm.openai]   <- added once an OpenAiProvider exists

[agent]
max_tokens = 1024
system_prompt = """
You are a portfolio research assistant. You explain market data and news clearly \
and cite your sources. You never tell the user to buy or sell a specific security.
"""
